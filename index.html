<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reembolsos Medicos</title>
<style>
:root{color-scheme:light;--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--primary:#3b82f6;--primary-d:#2563eb;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.05)}
header h1{font-size:17px;font-weight:700}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-d)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.stats{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.stat{flex:1;padding:12px 20px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.stat:last-child{border-right:none}
.stat-value{font-size:22px;font-weight:700}.stat-label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.pipeline{display:flex;gap:14px;padding:20px 24px;overflow-x:auto;min-height:calc(100vh - 120px);align-items:flex-start}
.column{flex:0 0 260px;background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.col-hd{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.col-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.stage-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.badge{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1px 7px;font-size:12px;color:var(--muted)}
.col-cards{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);border-color:var(--primary)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px}
.card-name{font-size:13px;font-weight:600;line-height:1.3;flex:1}
.card-amount{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;margin-left:6px}
.card-date{font-size:11px;color:var(--muted);margin-bottom:8px}
.card-docs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:500}
.chip-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.chip-miss{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.chip-neu{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.card-note{font-size:11px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:5px;padding:4px 7px;margin-bottom:8px;line-height:1.4}
.card-actions{display:flex;gap:5px;justify-content:flex-end}
.btn-adv{background:var(--primary);color:#fff;padding:4px 9px;font-size:11px;border-radius:6px;border:none;cursor:pointer;font-weight:600}
.btn-adv:hover{background:var(--primary-d)}
.btn-del{background:transparent;color:var(--red);border:1px solid #fecaca;padding:4px 9px;font-size:11px;border-radius:6px;cursor:pointer}
.empty{text-align:center;padding:18px 8px;color:var(--muted);font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.14)}
.modal-hd{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hd h2{font-size:15px;font-weight:700}
.modal-x{background:none;border:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:0}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.modal-ft{padding:14px 22px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600}
.field input,.field textarea{padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:60px}
.upload-box{border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;cursor:pointer;background:var(--bg)}
.upload-box:hover{border-color:var(--primary);background:#eff6ff}
.upload-box input[type=file]{display:none}
.upload-inner{display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.upload-ok{font-size:12px;color:#166534;font-weight:600;background:#f0fdf4;padding:2px 8px;border-radius:4px;margin-top:2px}
.sec-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:10px;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-l{display:flex;flex-direction:column;align-items:center}
.tl-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:2px}
.tl-line{width:2px;flex:1;background:var(--border);min-height:16px}
.tl-r{flex:1}
.tl-title{font-size:13px;font-weight:600}.tl-date{font-size:11px;color:var(--muted);margin-top:1px}
.tl-note{font-size:11px;color:var(--muted);margin-top:2px;font-style:italic}
.note-row{display:flex;gap:7px;margin-top:4px}
.note-row input{flex:1;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;outline:none;font-family:inherit}
.note-row input:focus{border-color:var(--primary)}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--muted);font-size:14px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Reembolsos Medicos</h1>
  <button class="btn btn-primary" onclick="openNew()">+ Nuevo reembolso</button>
</header>
<div class="stats" id="statsBar"></div>
<div class="pipeline" id="pipeline"><div class="loading"><div class="spinner"></div> Cargando...</div></div>
<div class="overlay hidden" id="newOverlay">
  <div class="modal">
    <div class="modal-hd"><h2>Nuevo reembolso</h2><button class="modal-x" onclick="closeNew()">x</button></div>
    <div class="modal-body">
      <div class="field"><label>Descripcion *</label><input id="nName" placeholder="Ej: Consulta cardiologia"/></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>Fecha</label><input type="date" id="nDate"/></div>
        <div class="field"><label>Monto ($)</label><input type="number" id="nAmount" placeholder="45000"/></div>
      </div>
      <div class="field"><label>Orden medica</label>
        <div class="upload-box" onclick="document.getElementById('fOrden').click()">
          <div class="upload-inner"><span style="font-size:22px">📋</span><span style="font-size:12px;color:var(--muted)">Adjuntar PDF o imagen</span><span class="upload-ok hidden" id="ordenOk"></span></div>
          <input type="file" id="fOrden" accept=".pdf,.jpg,.jpeg,.png" onchange="onFile('orden',this)"/>
        </div>
      </div>
      <div class="field"><label>Boleta</label>
        <div class="upload-box" onclick="document.getElementById('fBoleta').click()">
          <div class="upload-inner"><span style="font-size:22px">🧾</span><span style="font-size:12px;color:var(--muted)">Adjuntar PDF o imagen</span><span class="upload-ok hidden" id="boletaOk"></span></div>
          <input type="file" id="fBoleta" accept=".pdf,.jpg,.jpeg,.png" onchange="onFile('boleta',this)"/>
        </div>
      </div>
      <div class="field"><label>Notas</label><textarea id="nNote" placeholder="Info adicional..."></textarea></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeNew()">Cancelar</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveNew()">Guardar</button>
    </div>
  </div>
</div>
<div class="overlay hidden" id="detOverlay">
  <div class="modal">
    <div class="modal-hd"><h2 id="detTitle">Detalle</h2><button class="modal-x" onclick="closeDet()">x</button></div>
    <div class="modal-body" id="detBody"></div>
    <div class="modal-ft" id="detFt"></div>
  </div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxvs_Me7KmnMvBIdvR9KibCzeDkqkloksyALGI3DbMQPBy8J7kuRJO1hFTaTQNcFIqjNg/exec';
const STAGES=[{id:'pending',label:'Pendiente',color:'#64748b',icon:'📋',action:'Enviar a Banmedica'},{id:'banmedica',label:'En Banmedica',color:'#3b82f6',icon:'🏥',action:'Marcar aprobado'},{id:'approved',label:'Aprobado Banmedica',color:'#8b5cf6',icon:'✅',action:'Enviar a Bice Vida'},{id:'bicevida',label:'En Bice Vida',color:'#f59e0b',icon:'🛡️',action:'Marcar completado'},{id:'done',label:'Completado',color:'#22c55e',icon:'🎉',action:null}];
let items=[],curDet=null,nOrd=null,nBol=null,nOrdName='',nBolName='';
function clp(n){return '$'+Number(n).toLocaleString('es-CL')}
function fDate(d){if(!d)return'—';try{return new Date(d+'T12:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return d}}
function fDT(d){if(!d)return'';try{return new Date(d).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return d}}
async function fetchAll(){try{const res=await fetch(API+'?action=getAll');items=await res.json();render();}catch(e){document.getElementById('pipeline').innerHTML='<div class="loading">Error al cargar.</div>';}}
async function postData(data){try{await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify(data)});}catch(e){}await new Promise(r=>setTimeout(r,2000));await fetchAll();}
function render(){renderStats();renderPipeline();}
function renderStats(){const t=items.length,done=items.filter(i=>i.stage==='done').length,prog=items.filter(i=>i.stage!=='done'&&i.stage!=='pending').length,amt=items.reduce((s,i)=>s+(Number(i.amount)||0),0);document.getElementById('statsBar').innerHTML='<div class="stat"><span class="stat-value">'+t+'</span><span class="stat-label">Total</span></div><div class="stat"><span class="stat-value" style="color:#3b82f6">'+prog+'</span><span class="stat-label">En tramite</span></div><div class="stat"><span class="stat-value" style="color:#22c55e">'+done+'</span><span class="stat-label">Completados</span></div><div class="stat"><span class="stat-value" style="color:#8b5cf6">'+(amt?clp(amt):'—')+'</span><span class="stat-label">Monto total</span></div>';}
function renderPipeline(){document.getElementById('pipeline').innerHTML=STAGES.map(s=>{const cs=items.filter(i=>i.stage===s.id);return'<div class="column"><div class="col-hd"><div class="col-title"><span class="stage-dot" style="background:'+s.color+'"></span>'+s.icon+' '+s.label+'</div><span class="badge">'+cs.length+'</span></div><div class="col-cards">'+(cs.length?cs.map(c=>cardHtml(c,s)).join(''):'<div class="empty">Sin reembolsos</div>')+'</div></div>';}).join('');}
function cardHtml(item,stage){return'<div class="card" onclick="openDet(''+item.id+'')"><div class="card-top"><span class="card-name">'+item.name+'</span>'+(item.amount?'<span class="card-amount">'+clp(item.amount)+'</span>':'')+'</div><div class="card-date">📅 '+fDate(item.date)+'</div><div class="card-docs"><span class="chip '+(item.ordenUrl?'chip-ok':'chip-miss')+'">'+(item.ordenUrl?'✓':'!')+'  Orden</span><span class="chip '+(item.boletaUrl?'chip-ok':'chip-miss')+'">'+(item.boletaUrl?'✓':'!')+' Boleta</span></div>'+(item.latestNote?'<div class="card-note">💬 '+item.latestNote+'</div>':'')+'<div class="card-actions" onclick="event.stopPropagation()">'+(stage.action?'<button class="btn-adv" onclick="advance(''+item.id+'')">'+stage.action+' →</button>':'')+'<button class="btn-del" onclick="del(''+item.id+'')">🗑</button></div></div>';}
async function advance(id){const item=items.find(i=>i.id==id);if(!item)return;const idx=STAGES.findIndex(s=>s.id===item.stage);if(idx<STAGES.length-1){const ns=STAGES[idx+1].id;const h=[...(item.history||[]),{stage:ns,date:new Date().toISOString(),note:''}];showToast('Actualizando...');await postData({action:'update',id:item.id,stage:ns,history:h});showToast('Actualizado!');}}
async function del(id){if(!confirm('Eliminar?'))return;showToast('Eliminando...');await postData({action:'delete',id});showToast('Eliminado');}
function openNew(){['nName','nDate','nAmount','nNote'].forEach(id=>document.getElementById(id).value='');nOrd=nBol=null;nOrdName=nBolName='';['ordenOk','boletaOk'].forEach(id=>{const el=document.getElementById(id);el.textContent='';el.classList.add('hidden');});document.getElementById('newOverlay').classList.remove('hidden');}
function closeNew(){document.getElementById('newOverlay').classList.add('hidden');}
function onFile(type,input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{if(type==='orden'){nOrd=e.target.result;nOrdName=file.name;}else{nBol=e.target.result;nBolName=file.name;}const ok=document.getElementById(type==='orden'?'ordenOk':'boletaOk');ok.textContent='✓ '+file.name;ok.classList.remove('hidden');};reader.readAsDataURL(file);}
async function saveNew(){const name=document.getElementById('nName').value.trim();if(!name){alert('Ingresa una descripcion');return;}const id=Date.now().toString();const btn=document.getElementById('saveBtn');btn.textContent='Guardando...';btn.disabled=true;await postData({action:'create',id,name,date:document.getElementById('nDate').value,amount:document.getElementById('nAmount').value,latestNote:document.getElementById('nNote').value.trim()});if(nOrd){showToast('Subiendo orden...');await postData({action:'uploadFile',itemId:id,fileType:'orden',fileData:nOrd,fileName:nOrdName,mimeType:nOrd.split(';')[0].split(':')[1]});}if(nBol){showToast('Subiendo boleta...');await postData({action:'uploadFile',itemId:id,fileType:'boleta',fileData:nBol,fileName:nBolName,mimeType:nBol.split(';')[0].split(':')[1]});}btn.textContent='Guardar';btn.disabled=false;closeNew();showToast('Reembolso creado!');}
function openDet(id){const item=items.find(i=>i.id==id);if(!item)return;curDet=id;const stage=STAGES.find(s=>s.id===item.stage);document.getElementById('detTitle').textContent=item.name;const tl=(item.history||[]).map((h,idx,arr)=>{const s=STAGES.find(x=>x.id===h.stage);return'<div class="tl-item"><div class="tl-l"><div class="tl-dot" style="background:'+(s?s.color:'#ccc')+'"></div>'+(idx<arr.length-1?'<div class="tl-line"></div>':'')+'</div><div class="tl-r"><div class="tl-title">'+(s?s.icon:'')+' '+(s?s.label:h.stage)+'</div><div class="tl-date">'+fDT(h.date)+'</div>'+(h.note?'<div class="tl-note">"'+h.note+'"</div>':'')+'</div></div>';}).join('');document.getElementById('detBody').innerHTML='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px"><span class="chip chip-neu">📅 '+fDate(item.date)+'</span>'+(item.amount?'<span class="chip chip-neu">💰 '+clp(item.amount)+'</span>':'')+'<span class="chip" style="background:'+stage.color+'18;border:1px solid '+stage.color+'44;color:'+stage.color+'">'+stage.icon+' '+stage.label+'</span></div><div style="margin-top:14px"><div class="sec-title" style="margin-bottom:8px">Documentos</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+(item.ordenUrl?'<a href="'+item.ordenUrl+'" target="_blank" class="btn btn-ghost btn-sm">📋 '+(item.ordenName||'Orden')+'</a>':'<span class="chip chip-miss">! Orden pendiente</span>')+(item.boletaUrl?'<a href="'+item.boletaUrl+'" target="_blank" class="btn btn-ghost btn-sm">🧾 '+(item.boletaName||'Boleta')+'</a>':'<span class="chip chip-miss">! Boleta pendiente</span>')+'</div></div>'+(item.latestNote?'<div class="card-note" style="margin-top:12px">💬 '+item.latestNote+'</div>':'')+'<div style="margin-top:16px"><div class="sec-title" style="margin-bottom:8px">Historial</div><div class="tl">'+(tl||'Sin historial')+'</div></div><div style="margin-top:16px"><div class="sec-title" style="margin-bottom:6px">Agregar nota</div><div class="note-row"><input type="text" id="noteInp" placeholder="Observacion..." onkeydown="if(event.key==='Enter')addNote()"/><button class="btn btn-primary btn-sm" onclick="addNote()">Agregar</button></div></div>';const btns=[];if(stage.action)btns.push('<button class="btn btn-primary" onclick="advance(''+id+'');closeDet()">'+stage.action+' →</button>');btns.push('<button class="btn btn-ghost" onclick="closeDet()">Cerrar</button>');document.getElementById('detFt').innerHTML=btns.join('');document.getElementById('detOverlay').classList.remove('hidden');}
function closeDet(){document.getElementById('detOverlay').classList.add('hidden');curDet=null;}
async function addNote(){const inp=document.getElementById('noteInp');const note=inp.value.trim();if(!note||!curDet)return;const item=items.find(i=>i.id==curDet);if(!item)return;const h=[...(item.history||[]),{stage:item.stage,date:new Date().toISOString(),note}];showToast('Guardando nota...');await postData({action:'update',id:curDet,latestNote:note,history:h});openDet(curDet);}
function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
document.getElementById('newOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeNew();});
document.getElementById('detOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDet();});
fetchAll();
</script>
</body>
</html>
